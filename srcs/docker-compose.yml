
services:

  nginx:
    container_name: nginx
    build: requirements/nginx/
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    networks:
      - frontend

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    restart: always
    ports:
      - 9000:9000
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    networks:
      - frontend
      - backend
    environment:
      MYSQL_HOST:        ${MYSQL_HOST}
      WP_DATABASE_NAME:  ${WP_DATABASE_NAME}
      WP_DATABASE_USER:  ${WP_DATABASE_USER}
      WP_DATABASE_PWD:   ${WP_DATABASE_PWD}
      DOMAIN_NAME:       ${DOMAIN_NAME}
      WP_TITLE:          ${WP_TITLE}
      WP_ADMIN_USER:      ${WP_ADMIN_USER}
      WP_ADMIN_PWD:      ${WP_ADMIN_PWD}
      WP_ADMIN_EMAIL:    ${WP_ADMIN_EMAIL}
      WP_USR:            ${WP_USR}
      WP_PWD:            ${WP_PWD}
      WP_EMAIL:          ${WP_EMAIL}

  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    restart: always
    ports:
      - 3306:3306
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - backend
    environment:
      MYSQL_ROOT_PWD:    ${MYSQL_ROOT_PWD}
      WP_DATABASE_NAME:  ${WP_DATABASE_NAME}
      WP_DATABASE_USER:  ${WP_DATABASE_USER}
      WP_DATABASE_PWD:   ${WP_DATABASE_PWD}

networks:
  frontend:
  backend:

volumes:
  wordpress:
    driver: local
    name: wordpress
    driver_opts:
      type: none
      o: bind
      device: /home/jojo/data/wordpress
  mariadb:
    driver: local
    name: mariadb
    driver_opts:
      type: none
      o: bind
      device: /home/jojo/data/mariadb
