services:

  nginx:
    build: requirements/nginx/
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - 443:443
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    networks:
      - frontend

  wordpress:
    build: requirements/wordpress/
    image: wordpress
    container_name: wordpress
    restart: always
    ports:
      - 9000:9000
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    networks:
      - frontend
      - backend
    secrets:
      - credentials
      - db_password
      - wp_admin_password
      - wp_user_password
    environment:
      WP_DATABASE_NAME: ${WP_DATABASE_NAME}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}

  mariadb:
    build: requirements/mariadb/
    image: mariadb
    container_name: mariadb
    restart: always
    ports:
      - 3306:3306
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - backend
    secrets:
      - credentials
      - db_root_password
      - db_password
    environment:
      WP_DATABASE_NAME: ${WP_DATABASE_NAME}

networks:
  frontend:
  backend:

volumes:
  wordpress:
    driver: local
    name: wordpress
    driver_opts:
      type: none
      o: bind
      device: /home/jojo/data/wordpress
  mariadb:
    driver: local
    name: mariadb
    driver_opts:
      type: none
      o: bind
      device: /home/jojo/data/mariadb
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  credentials:
    file: ../secrets/credentials.txt
